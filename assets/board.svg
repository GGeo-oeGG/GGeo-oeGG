<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#131c38"/>
    </linearGradient>
    <linearGradient id="ch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22345c"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d2b4f"/>
      <stop offset="1" stop-color="#2a3f72"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#8ff7ff"/>
      <stop offset="0.45" stop-color="#2fc6ff"/>
      <stop offset="1" stop-color="#0f67e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="360" rx="16" fill="url(#bd)"/>

  <!-- дорожки платы -->
  <g stroke="#2f4277" stroke-width="2" fill="none" stroke-linecap="round">
    <path id="tA" d="M20 40 H880"/>
    <path id="tB" d="M20 300 H880"/>
    <path id="tC" d="M20 80 H880"/>
    <path id="tD" d="M20 120 H520 V95 H880"/>
    <path id="tE" d="M20 220 H880"/>
    <path id="tF" d="M20 170 H300 V260"/>
  </g>

  <!-- электроны -->
  <g>
    <circle r="2" cy="40" cx="0" fill="#58e0ff" opacity="0.4"><animateMotion dur="4s" repeatCount="indefinite" path="M20 40 H880"/></circle>
    <circle r="3" cy="40" cx="0" fill="#58e0ff"><animateMotion dur="4s" begin="0.9s" repeatCount="indefinite" path="M680 40 H20" rotate="auto"/></circle>
    <circle r="3" cy="300" cx="0" fill="#3cf0a5"><animateMotion dur="3.6s" repeatCount="indefinite" path="M20 300 H880"/></circle>
    <circle r="3" cy="80" cx="0" fill="#ff6ad5"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M20 80 H880"/></circle>
    <circle r="3" cy="120" cx="0" fill="#ffd166"><animateMotion dur="5s" repeatCount="indefinite" path="M20 120 H520 V95 H880"/></circle>
    <circle r="3" cy="220" cx="0" fill="#eaf2ff"><animateMotion dur="2.9s" begin="1.4s" repeatCount="indefinite" path="M20 220 H880"/></circle>
    <circle r="3" cy="170" cx="0" fill="#3cf0a5"><animateMotion dur="1.9s" repeatCount="indefinite" path="M20 170 H300 V260"/></circle>
  </g>

  <!-- индикаторные точки -->
  <g>
    <circle cx="20" cy="40" r="4" fill="#ffd166"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="80" r="4" fill="#ff6ad5"><animate attributeName="opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="300" r="4" fill="#3cf0a5"><animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="220" r="4" fill="#eaf2ff"><animate attributeName="opacity" values="1;0.15;1" dur="0.9s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- кулер -->
  <g transform="translate(110,55)">
    <circle r="45" fill="none" stroke="#2f4277" stroke-width="5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2.0s" repeatCount="indefinite"/>
      <path d="M0 -1 Q1 -1 41 0 Q20 18 0 14 Q-12 0 10 -19" fill="#22345c" stroke="#4a6bb5" stroke-width="1.5"/>
      <path d="M0 -1 Q1 -1 41 0 Q20 18 0 14 Q-12 0 10 -19" fill="#22345c" stroke="#4a6bb5" stroke-width="1.5" transform="rotate(0)"/>
      <path d="M0 -1 Q1 -1 41 0 Q20 18 0 14 Q-12 0 10 -19" fill="#22345c" stroke="#4a6bb5" stroke-width="1.5" transform="rotate(60)"/>
      <path d="M0 -1 Q1 -1 41 0 Q20 18 0 14 Q-12 0 10 -19" fill="#22345c" stroke="#4a6bb5" stroke-width="1.5" transform="rotate(120)"/>
      <path d="M0 -1 Q1 -1 41 0 Q20 18 0 14 Q-12 0 10 -19" fill="#22345c" stroke="#4a6bb5" stroke-width="1.5" transform="rotate(180)"/>
      <path d="M0 -1 Q1 -1 41 0 Q20 18 0 14 Q-12 0 10 -19" fill="#22345c" stroke="#4a6bb5" stroke-width="1.5" transform="rotate(240)"/>
      <path d="M0 -1 Q1 -1 41 0 Q20 18 0 14 Q-12 0 10 -19" fill="#22345c" stroke="#4a6bb5" stroke-width="1.5" transform="rotate(300)"/>
    </g>
    <circle r="23" fill="#0a0e1a" stroke="#4a6bb5" stroke-width="2"/>
    <text x="0" y="4" fill="#58e0ff" font-size="12" font-weight="bold" text-anchor="middle">TOWER</text>
  </g>

  <!-- процессор -->
  <g>
    <rect x="325" y="105" width="200" height="150" rx="12" fill="url(#ch)" stroke="#4a6bb5" stroke-width="2"/>
    <rect x="346" y="142" width="158" height="90" fill="none" stroke="#5b7fd4" stroke-width="1"/>
    <rect x="335" y="115" width="12" height="12" rx="2" fill="#4a6bb5"/>
    <rect x="503" y="115" width="12" height="12" rx="2" fill="#4a6bb5"/>
    <rect x="335" y="233" width="12" height="12" rx="2" fill="#4a6bb5"/>
    <rect x="503" y="233" width="12" height="12" rx="2" fill="#4a6bb5"/>
    <text x="425" y="126" fill="#cfe3ff" font-size="12" letter-spacing="5" text-anchor="middle">STONE</text>
    <circle cx="425" cy="187" r="30" fill="url(#core)">
      <animate attributeName="r" values="26;60;26" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="425" y="192" fill="#071127" font-size="12" font-weight="bold" text-anchor="middle">5 GHz</text>
  </g>

  <!-- оперативная память -->
  <g>
    <rect x="560" y="70" width="44" height="190" rx="6" fill="url(#ram)" stroke="#5b7fd4" stroke-width="2"/>
    <rect x="568" y="84" width="28" height="26" rx="2" fill="#101a30"/>
    <rect x="568" y="118" width="28" height="26" rx="2" fill="#101a30"/>
    <rect x="568" y="152" width="28" height="26" rx="2" fill="#101a30"/>
    <rect x="568" y="186" width="28" height="26" rx="2" fill="#101a30"/>
    <rect x="568" y="220" width="28" height="26" rx="2" fill="#101a30"/>
    <rect x="616" y="95" width="44" height="140" rx="6" fill="url(#ram)" stroke="#5b7fd4" stroke-width="2"/>
    <rect x="624" y="108" width="28" height="26" rx="2" fill="#101a30"/>
    <rect x="624" y="142" width="28" height="26" rx="2" fill="#101a30"/>
    <rect x="624" y="176" width="28" height="26" rx="2" fill="#101a30"/>
    <rect x="624" y="210" width="28" height="26" rx="2" fill="#101a30"/>
    <text x="610" y="58" fill="#7fb0ff" font-size="12" letter-spacing="4" text-anchor="middle">BAR</text>
  </g>

  <!-- видеокарта -->
  <g>
    <rect x="720" y="150" width="150" height="130" rx="10" fill="url(#ch)" stroke="#b05ef0" stroke-width="2"/>
    <circle cx="795" cy="215" r="24" fill="url(#glow)">
      <animate attributeName="r" values="20;30;20" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="795" y="135" fill="#e5b8ff" font-size="12" letter-spacing="4" text-anchor="middle">VIKA</text>
    <g transform="translate(770,190)">
      <animateTransform attributeName="transform" type="rotate" from="0 770 190" to="360 770 190" dur="1.4s" repeatCount="indefinite"/>
      <circle r="12" fill="none" stroke="#4a6bb5" stroke-width="2"/>
      <circle r="12" fill="#22345c" cx="6" cy="0"/>
    </g>
    <g transform="translate(795,190)">
      <animateTransform attributeName="transform" type="rotate" from="0 795 190" to="-360 795 190" dur="1.4s" repeatCount="indefinite"/>
      <circle r="12" fill="none" stroke="#4a6bb5" stroke-width="2"/>
      <circle r="12" fill="#22345c" cx="-6" cy="0"/>
    </g>
    <text x="795" y="262" fill="#b98fe0" font-size="10" letter-spacing="2" text-anchor="middle">500MB</text>
  </g>

  <!-- накопитель -->
  <g>
    <rect x="60" y="245" width="150" height="60" rx="10" fill="#12203a" stroke="#37c978" stroke-width="2"/>
    <text x="135" y="270" fill="#8fe8bd" font-size="12" letter-spacing="4" text-anchor="middle">WINCH</text>
    <rect x="85" y="282" width="40" height="6" rx="3" fill="#37c978">
      <animate attributeName="width" values="6;111;6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="85" y="292" width="40" height="3" rx="3" fill="#9abd28">
      <animate attributeName="width" values="0;111;0" dur="1.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- заголовок -->
  <rect x="250" y="8" width="400" height="26" rx="13" fill="#0a0e1a" opacity="0.75"/>
  <text x="450" y="26" fill="#8ad4ff" font-size="15" font-weight="bold" letter-spacing="6" text-anchor="middle">WAKE up NEO</text>

  <!-- нижняя строка -->
  <text x="450" y="348" fill="#44618f" font-size="13" text-anchor="middle">CPU &#183; GPU &#183; RAM &#183; SSD &#183; FAN &#183; ON OFF</text>
  <text x="750" y="348" font-size="15" fill="#58e0ff">|</text>
  <text x="750" y="348" font-size="15" fill="#58e0ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite">|</animate></text>
</svg>